<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroArcade - Unblocked Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">🎮 RetroArcade</div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search games...">
        </div>
    </header>

    <main class="container">
        <section id="gameGridView">
            <h2>Featured Games</h2>
            <div id="gameGrid" class="game-grid"></div>
        </section>

        <section id="gamePlayerView" class="hidden">
            <button id="backBtn" class="back-btn">⬅ Back to Games</button>
            <div class="player-container">
                <h2 id="currentGameTitle">Game Title</h2>
                <div class="iframe-wrapper">
                    <iframe id="gameIframe" src="" frameborder="0" allowfullscreen></iframe>
                    <div class="game-container">
                 </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 RetroArcade. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
