<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #064e3b 0%, #090d16 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100dvh;
            padding: 14px 10px 22px 10px;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            background: rgba(15, 23, 42, 0.75);
            padding: 12px 22px;
            border-radius: 16px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .label { font-size: 0.72rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .val { font-size: 1.6rem; font-weight: 900; color: #10b981; }
        .best { color: #fbbf24; }

        canvas {
            background: #0f172a;
            border-radius: 16px;
            border: 2px solid rgba(16, 185, 129, 0.45);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
        }

        .hint { color: #94a3b8; font-size: 0.9rem; }

        #modal {
            position: fixed;
            inset: 0;
            background: rgba(9, 13, 22, 0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .hidden { display: none !important; }
        .modal-card {
            background: #1e293b;
            padding: 28px;
            border-radius: 18px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.15);
            width: 82%;
            max-width: 320px;
        }
        .modal-card h2 { font-size: 1.8rem; margin-bottom: 10px; color: #f43f5e; }
        .modal-card p { margin-bottom: 20px; color: #cbd5e1; }
        .btn {
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: #090d16;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-weight: 900;
            font-size: 1.05rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div><div class="label">Punkte</div><div class="val" id="score">0</div></div>
        <div style="text-align:right;"><div class="label">Rekord</div><div class="val best" id="best">0</div></div>
    </div>

    <canvas id="canvas"></canvas>

    <div class="hint">Wische in eine Richtung (Handy) oder Pfeiltasten (PC)</div>

    <div id="modal" class="hidden">
        <div class="modal-card">
            <h2>Crash!</h2>
            <p>Endstand: <strong id="finalScore">0</strong></p>
            <button class="btn" onclick="init()">Nochmal spielen</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const GRID = 20;
        let tileSize, snake, dir, nextDir, food, score, particles, loopId;
        let best = parseInt(localStorage.getItem('bestSnake')) || 0;

        function resize() {
            const size = Math.floor(Math.min(window.innerWidth - 24, window.innerHeight - 190, 400) / GRID) * GRID;
            canvas.width = size;
            canvas.height = size;
            tileSize = size / GRID;
        }

        function init() {
            resize();
            snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
            dir = { x: 1, y: 0 };
            nextDir = { x: 1, y: 0 };
            score = 0;
            particles = [];
            document.getElementById('score').textContent = 0;
            document.getElementById('best').textContent = best;
            document.getElementById('modal').classList.add('hidden');
            spawnFood();
            clearInterval(loopId);
            loopId = setInterval(update, 115);
        }

        function spawnFood() {
            while (true) {
                let fx = Math.floor(Math.random() * GRID);
                let fy = Math.floor(Math.random() * GRID);
                if (!snake.some(s => s.x === fx && s.y === fy)) {
                    food = { x: fx, y: fy };
                    break;
                }
            }
        }

        function spawnSparks(gx, gy) {
            for (let i = 0; i < 12; i++) {
                let ang = Math.random() * Math.PI * 2;
                let spd = 1.5 + Math.random() * 4;
                particles.push({
                    x: (gx + 0.5) * tileSize,
                    y: (gy + 0.5) * tileSize,
                    vx: Math.cos(ang) * spd,
                    vy: Math.sin(ang) * spd,
                    life: 1
                });
            }
        }

        function update() {
            dir = nextDir;
            const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

            if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
                snake.some(s => s.x === head.x && s.y === head.y)) {
                clearInterval(loopId);
                document.getElementById('finalScore').textContent = score;
                document.getElementById('modal').classList.remove('hidden');
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                if (score > best) {
                    best = score;
                    localStorage.setItem('bestSnake', best);
                    document.getElementById('best').textContent = best;
                }
                spawnSparks(food.x, food.y);
                spawnFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dezentes Raster
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            for (let i = 0; i < GRID; i++) {
                ctx.beginPath(); ctx.moveTo(i * tileSize, 0); ctx.lineTo(i * tileSize, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * tileSize); ctx.lineTo(canvas.width, i * tileSize); ctx.stroke();
            }

            // Leuchtendes Futter
            ctx.save();
            ctx.fillStyle = '#ff2a5f';
            ctx.shadowColor = '#ff2a5f';
            ctx.shadowBlur = 14;
            ctx.beginPath();
            ctx.arc((food.x + 0.5) * tileSize, (food.y + 0.5) * tileSize, tileSize * 0.38, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Neon-Schlange
            snake.forEach((seg, idx) => {
                ctx.save();
                ctx.fillStyle = idx === 0 ? '#6ee7b7' : '#10b981';
                ctx.shadowColor = '#10b981';
                ctx.shadowBlur = idx === 0 ? 12 : 4;
                ctx.beginPath();
                ctx.roundRect(seg.x * tileSize + 1.5, seg.y * tileSize + 1.5, tileSize - 3, tileSize - 3, 6);
                ctx.fill();
                ctx.restore();
            });

            // Partikel
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.08;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = '#ffd500';
                ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
                ctx.restore();
            }
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp' && dir.y === 0) nextDir = { x: 0, y: -1 };
            if (e.key === 'ArrowDown' && dir.y === 0) nextDir = { x: 0, y: 1 };
            if (e.key === 'ArrowLeft' && dir.x === 0) nextDir = { x: -1, y: 0 };
            if (e.key === 'ArrowRight' && dir.x === 0) nextDir = { x: 1, y: 0 };
        });

        let sx = 0, sy = 0;
        window.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: false });
        window.addEventListener('touchend', e => {
            let dx = e.changedTouches[0].clientX - sx;
            let dy = e.changedTouches[0].clientY - sy;
            if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0 && dir.x === 0) nextDir = { x: 1, y: 0 };
                else if (dx < 0 && dir.x === 0) nextDir = { x: -1, y: 0 };
            } else {
                if (dy > 0 && dir.y === 0) nextDir = { x: 0, y: 1 };
                else if (dy < 0 && dir.y === 0) nextDir = { x: 0, y: -1 };
            }
        });

        window.addEventListener('resize', resize);
        init();
    </script>
</body>
</html>
