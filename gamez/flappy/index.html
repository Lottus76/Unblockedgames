<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Flappy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #090d16;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            overflow: hidden;
        }

        canvas {
            background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%);
            border-radius: 16px;
            border: 2px solid rgba(236, 72, 153, 0.45);
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.25);
            max-width: 100%;
            max-height: 100dvh;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = Math.min(window.innerWidth - 16, 400);
            canvas.height = Math.min(window.innerHeight - 16, 650);
        }
        resize();

        let bird, pipes, particles, score, best, state, frame;
        best = parseInt(localStorage.getItem('bestFlappy')) || 0;

        function reset() {
            bird = { x: 80, y: canvas.height / 2, vy: 0, r: 15 };
            pipes = [];
            particles = [];
            score = 0;
            frame = 0;
            state = 'START';
        }

        function flap() {
            if (state === 'START') state = 'PLAY';
            if (state === 'PLAY') {
                bird.vy = -7.2;
                for (let i = 0; i < 6; i++) {
                    particles.push({
                        x: bird.x - 10,
                        y: bird.y,
                        vx: -2 - Math.random() * 2,
                        vy: (Math.random() - 0.5) * 3,
                        life: 1
                    });
                }
            } else if (state === 'OVER') {
                reset();
            }
        }

        function update() {
            frame++;
            if (state === 'PLAY') {
                bird.vy += 0.38;
                bird.y += bird.vy;

                if (frame % 95 === 0) {
                    const gap = 145;
                    const minTop = 60;
                    const maxTop = canvas.height - gap - 80;
                    const topH = minTop + Math.random() * (maxTop - minTop);
                    pipes.push({ x: canvas.width, top: topH, gap, passed: false });
                }

                for (let i = pipes.length - 1; i >= 0; i--) {
                    let p = pipes[i];
                    p.x -= 3.2;

                    if (!p.passed && p.x + 54 < bird.x) {
                        p.passed = true;
                        score++;
                        if (score > best) {
                            best = score;
                            localStorage.setItem('bestFlappy', best);
                        }
                    }

                    if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + 54 &&
                        (bird.y - bird.r < p.top || bird.y + bird.r > p.top + p.gap)) {
                        state = 'OVER';
                    }

                    if (p.x + 54 < 0) pipes.splice(i, 1);
                }

                if (bird.y + bird.r > canvas.height || bird.y - bird.r < 0) {
                    state = 'OVER';
                }
            } else if (state === 'START') {
                bird.y = canvas.height / 2 + Math.sin(frame * 0.08) * 8;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Röhren
            pipes.forEach(p => {
                ctx.save();
                ctx.fillStyle = '#00e676';
                ctx.shadowColor = '#00e676';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.roundRect(p.x, 0, 54, p.top, [0, 0, 8, 8]);
                ctx.roundRect(p.x, p.top + p.gap, 54, canvas.height - (p.top + p.gap), [8, 8, 0, 0]);
                ctx.fill();
                ctx.restore();
            });

            // Partikel
            for (let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i];
                pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.05;
                if (pt.life <= 0) { particles.splice(i, 1); continue; }
                ctx.save();
                ctx.globalAlpha = pt.life;
                ctx.fillStyle = '#00d4ff';
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Neon-Vogel
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate(Math.min(Math.max(bird.vy * 0.06, -0.5), 0.7));
            ctx.fillStyle = '#ffd500';
            ctx.shadowColor = '#ffd500';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
            ctx.fill();
            // Auge
            ctx.fillStyle = '#090d16';
            ctx.beginPath();
            ctx.arc(6, -4, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Punktestand
            ctx.fillStyle = '#fff';
            ctx.font = '900 42px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(score, canvas.width / 2, 65);

            if (state === 'START') {
                ctx.font = '700 20px "Segoe UI", sans-serif';
                ctx.fillStyle = '#cbd5e1';
                ctx.fillText('Tippen zum Starten!', canvas.width / 2, canvas.height / 2 + 65);
            } else if (state === 'OVER') {
                ctx.fillStyle = 'rgba(9, 13, 22, 0.78)';
                ctx.fillRect(30, canvas.height / 2 - 85, canvas.width - 60, 170);
                ctx.strokeStyle = '#ff2a5f';
                ctx.lineWidth = 2;
                ctx.strokeRect(30, canvas.height / 2 - 85, canvas.width - 60, 170);

                ctx.fillStyle = '#ff2a5f';
                ctx.font = '900 28px "Segoe UI", sans-serif';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 35);

                ctx.fillStyle = '#fbbf24';
                ctx.font = '700 18px "Segoe UI", sans-serif';
                ctx.fillText('Rekord: ' + best, canvas.width / 2, canvas.height / 2 + 5);

                ctx.fillStyle = '#fff';
                ctx.font = '600 16px "Segoe UI", sans-serif';
                ctx.fillText('Tippen für Neustart', canvas.width / 2, canvas.height / 2 + 48);
            }

            requestAnimationFrame(() => { update(); draw(); });
        }

        window.addEventListener('mousedown', flap);
        window.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, { passive: false });
        window.addEventListener('keydown', e => { if (e.code === 'Space' || e.key === 'ArrowUp') flap(); });

        reset();
        draw();
    </script>
</body>
</html>
