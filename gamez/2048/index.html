<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 Neon</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #1e1b4b 0%, #090d16 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100dvh;
            padding: 15px 12px 24px 12px;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            background: rgba(30, 41, 59, 0.75);
            padding: 12px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .score-box { text-align: center; }
        .label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .val { font-size: 1.6rem; font-weight: 900; }
        .best { color: #fbbf24; }

        .board {
            position: relative;
            width: min(92vw, 390px);
            height: min(92vw, 390px);
            background: #111827;
            border-radius: 16px;
            border: 2px solid rgba(99, 102, 241, 0.4);
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
        }

        .cell {
            background: #192236;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 900;
            transition: transform 0.12s ease, background 0.15s ease;
        }

        .pop { animation: popAnim 0.18s ease; }
        @keyframes popAnim {
            0% { transform: scale(0.7); }
            70% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        .controls-hint {
            color: #94a3b8;
            font-size: 0.9rem;
            text-align: center;
        }

        .new-btn {
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
        }

        #modal {
            position: fixed;
            inset: 0;
            background: rgba(9, 13, 22, 0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .hidden { display: none !important; }
        .modal-card {
            background: #1e293b;
            padding: 28px;
            border-radius: 18px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.15);
            width: 82%;
            max-width: 320px;
        }
        .modal-card h2 { font-size: 1.8rem; margin-bottom: 10px; color: #f43f5e; }
        .modal-card p { margin-bottom: 20px; color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-box"><div class="label">Punkte</div><div class="val" id="score">0</div></div>
        <button class="new-btn" onclick="init()">Neu</button>
        <div class="score-box"><div class="label">Rekord</div><div class="val best" id="best">0</div></div>
    </div>

    <div class="board" id="board"></div>

    <div class="controls-hint">Wische (Handy) oder nutze Pfeiltasten (PC)</div>

    <div id="modal" class="hidden">
        <div class="modal-card">
            <h2>Game Over!</h2>
            <p>Punkte: <strong id="finalScore">0</strong></p>
            <button class="new-btn" style="width:100%; padding:14px;" onclick="init()">Nochmal spielen</button>
        </div>
    </div>

    <script>
        const COLORS = {
            2: { bg: '#3b82f6', glow: 'rgba(59,130,246,0.4)' },
            4: { bg: '#06b6d4', glow: 'rgba(6,182,212,0.4)' },
            8: { bg: '#10b981', glow: 'rgba(16,185,129,0.5)' },
            16: { bg: '#84cc16', glow: 'rgba(132,204,22,0.5)' },
            32: { bg: '#eab308', glow: 'rgba(234,179,8,0.5)' },
            64: { bg: '#f97316', glow: 'rgba(249,115,22,0.6)' },
            128: { bg: '#ef4444', glow: 'rgba(239,68,68,0.6)' },
            256: { bg: '#ec4899', glow: 'rgba(236,72,153,0.7)' },
            512: { bg: '#a855f7', glow: 'rgba(168,85,247,0.7)' },
            1024: { bg: '#6366f1', glow: 'rgba(99,102,241,0.8)' },
            2048: { bg: '#ffd500', glow: 'rgba(255,213,0,0.9)' }
        };

        let grid, score, best = parseInt(localStorage.getItem('best2048')) || 0;
        let mergedCoords = [];

        function init() {
            grid = Array.from({ length: 4 }, () => Array(4).fill(0));
            score = 0;
            mergedCoords = [];
            document.getElementById('modal').classList.add('hidden');
            addTile();
            addTile();
            render();
        }

        function addTile() {
            let empty = [];
            for (let r = 0; r < 4; r++)
                for (let c = 0; c < 4; c++)
                    if (grid[r][c] === 0) empty.push({ r, c });
            if (empty.length === 0) return;
            const { r, c } = empty[Math.floor(Math.random() * empty.length)];
            grid[r][c] = Math.random() < 0.9 ? 2 : 4;
            mergedCoords.push(`${r},${c}`);
        }

        function render() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            document.getElementById('score').textContent = score;
            if (score > best) {
                best = score;
                localStorage.setItem('best2048', best);
            }
            document.getElementById('best').textContent = best;

            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const val = grid[r][c];
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (val > 0) {
                        const style = COLORS[val] || { bg: '#ff2a5f', glow: 'rgba(255,42,95,0.8)' };
                        cell.style.background = style.bg;
                        cell.style.boxShadow = `0 0 15px ${style.glow}`;
                        cell.style.color = val === 2048 ? '#090d16' : '#fff';
                        cell.style.fontSize = val >= 1024 ? '1.35rem' : '1.8rem';
                        cell.textContent = val;
                        if (mergedCoords.includes(`${r},${c}`)) cell.classList.add('pop');
                    }
                    board.appendChild(cell);
                }
            }
            mergedCoords = [];
        }

        function slide(row) {
            let arr = row.filter(v => v !== 0);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr[i + 1] = 0;
                }
            }
            arr = arr.filter(v => v !== 0);
            while (arr.length < 4) arr.push(0);
            return arr;
        }

        function move(dir) {
            let prev = JSON.stringify(grid);
            if (dir === 'left' || dir === 'right') {
                for (let r = 0; r < 4; r++) {
                    let row = dir === 'right' ? [...grid[r]].reverse() : [...grid[r]];
                    let res = slide(row);
                    if (dir === 'right') res.reverse();
                    for (let c = 0; c < 4; c++) {
                        if (res[c] !== grid[r][c] && res[c] > 0) mergedCoords.push(`${r},${c}`);
                    }
                    grid[r] = res;
                }
            } else {
                for (let c = 0; c < 4; c++) {
                    let col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
                    if (dir === 'down') col.reverse();
                    let res = slide(col);
                    if (dir === 'down') res.reverse();
                    for (let r = 0; r < 4; r++) {
                        if (res[r] !== grid[r][c] && res[r] > 0) mergedCoords.push(`${r},${c}`);
                        grid[r][c] = res[r];
                    }
                }
            }

            if (JSON.stringify(grid) !== prev) {
                addTile();
                render();
                if (isGameOver()) {
                    document.getElementById('finalScore').textContent = score;
                    document.getElementById('modal').classList.remove('hidden');
                }
            }
        }

        function isGameOver() {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 0) return false;
                    if (c < 3 && grid[r][c] === grid[r][c + 1]) return false;
                    if (r < 3 && grid[r][c] === grid[r + 1][c]) return false;
                }
            }
            return true;
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') move('left');
            if (e.key === 'ArrowRight') move('right');
            if (e.key === 'ArrowUp') move('up');
            if (e.key === 'ArrowDown') move('down');
        });

        let sx = 0, sy = 0;
        window.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: false });
        window.addEventListener('touchend', e => {
            let dx = e.changedTouches[0].clientX - sx;
            let dy = e.changedTouches[0].clientY - sy;
            if (Math.abs(dx) < 25 && Math.abs(dy) < 25) return;
            if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
            else move(dy > 0 ? 'down' : 'up');
        });

        init();
    </script>
</body>
</html>
